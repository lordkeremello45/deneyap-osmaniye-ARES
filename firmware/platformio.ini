[platformio]
default_envs = ares-card1-gateway, ares-card2-sensors, ares-card1-mqtt-compile-check

[env]
platform = espressif32
board = deneyapkart
framework = arduino
monitor_speed = 115200

[env:ares-card2-sensors]
build_flags =
  -DLEGACY_I2C
  -DARES_ROLE_SENSOR_NODE
build_src_filter =
  +<main.cpp>
  +<sensor_drivers.cpp>
lib_deps =
  https://github.com/NachtRaveVL/Lepton-FLiR-Arduino.git#8577d336ecfc12dc8f3d0612cf8b6dcd681d626f
  garmin/LIDAR-Lite@3.0.6

[env:ares-card1-gateway]
build_flags =
  -DARES_ROLE_GATEWAY
build_src_filter =
  +<gateway_main.cpp>
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  knolleary/PubSubClient@2.8

; Safety constraints:
; - DWM3000 is still not integrated; its selected ESP-IDF driver is not a drop-in Arduino library.
; - XVF3800 UAC2 remains host-side for a confirmed UA/USB assembly; a bare chip is not USB-ready.
; - GS-One LF requires a designed analog front-end and calibrated ADC path.
; - No sensor GPIO is enabled by default. Configure verified raw GPIO numbers in
;   firmware/include/ares_board_config.h after checking the exact physical board revision.
; - MQTT remains disabled unless a local, untracked firmware/include/ares_secrets.h explicitly enables it.

; Compile the TLS/MQTT-enabled branch with fake, non-deployable credentials.
; This environment is for compilation only and must never be flashed.
[env:ares-card1-mqtt-compile-check]
build_flags =
  -DARES_ROLE_GATEWAY
  -DARES_MQTT_TEST_CONFIG
build_src_filter =
  +<gateway_main.cpp>
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  knolleary/PubSubClient@2.8

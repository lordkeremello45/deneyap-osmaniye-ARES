[env:deneyap-kart-v2]
platform = espressif32
board = deneyapkart
framework = arduino
monitor_speed = 115200

; Garmin's library supports ESP32's Wire API through its documented legacy path.
; This avoids the unsupported five-argument requestFrom overload in v3HP/v4LED.
build_flags =
  -DLEGACY_I2C

; Real installed sensors, pinned to a stable release or exact upstream commit.
; Lepton 3.5: VoSPI over SPI + CCI over I2C; breakout/pin mapping still required.
; Garmin LIDAR-Lite v3: Garmin's LIDAR-Lite Arduino library.
lib_deps =
  https://github.com/NachtRaveVL/Lepton-FLiR-Arduino.git#8577d336ecfc12dc8f3d0612cf8b6dcd681d626f
  garmin/LIDAR-Lite@3.0.6

; DWM3000 driver candidate (NOT added as lib_deps because it is an ESP-IDF port):
; br101/dw3000-decadriver-source @ 67dfbb7f2c5b1a4157b8c265b19f08776e91b1cc
; Qorvo DW3xxx driver 08.02.02 base; ESP-IDF 5.1.4 platform; licensing must be preserved.
; Integrate only after validating the physical ESP32-S3 target and ESP-IDF + Arduino build.
; - DWM3000: do not substitute a DW1000 driver; device-ID and two-node ranging tests are required.
; - XVF3800: default to USB Audio Class 2.0 on the Windows host only for a confirmed UA/USB assembly; INT firmware requires I2S host support.
; - GS-One LF: analog front-end + ADC and calibration are required.
; - 74LVC2G17: hardware logic buffer, no software library.
; - SD card: ESP32 Arduino SD/SPI APIs are built into the framework.

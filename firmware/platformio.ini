[env:deneyap-kart-v2]
platform = espressif32
board = deneyapkart
framework = arduino
monitor_speed = 115200

; Garmin's library supports ESP32's Wire API through its documented legacy path.
; This avoids the unsupported five-argument requestFrom overload in v3HP/v4LED.
build_flags =
  -DLEGACY_I2C

; Real installed sensors, pinned to a stable release or exact upstream commit.
; Lepton 3.5: VoSPI over SPI + CCI over I2C; breakout/pin mapping still required.
; Garmin LIDAR-Lite v3: Garmin's LIDAR-Lite Arduino library.
lib_deps =
  https://github.com/NachtRaveVL/Lepton-FLiR-Arduino.git#8577d336ecfc12dc8f3d0612cf8b6dcd681d626f
  garmin/LIDAR-Lite@3.0.6

; No generic Arduino library is appropriate for these parts:
; - DWM3000: do not substitute a DW1000 driver; select/validate a licensed DW3000 port.
; - XVF3800: use USB Audio Class on a host, or matching I2S firmware + I2S host.
; - GS-One LF: analog front-end + ADC and calibration are required.
; - 74LVC2G17: hardware logic buffer, no software library.
; - SD card: ESP32 Arduino SD/SPI APIs are built into the framework.

name: ARES CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry:
    name: Drone Telemetry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S drone_telemetry -B drone_telemetry/build
      - run: cmake --build drone_telemetry/build --parallel
      - run: ctest --test-dir drone_telemetry/build --output-on-failure

  cpp:
    name: C++ AI Core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S ai_core -B ai_core/build
      - run: cmake --build ai_core/build --parallel

  go:
    name: Go Bridge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Format check
        working-directory: bridge_service
        run: test -z "$(gofmt -l .)"
      - name: Test
        working-directory: bridge_service
        run: go test ./...

  flutter:
    name: Android Controller
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencies
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze
        working-directory: mobile_app
        run: flutter analyze
      - name: Test
        working-directory: mobile_app
        run: flutter test

  firmware:
    name: Deneyap Firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: platformio/action@v2
      - name: Build
        working-directory: firmware
        run: pio run

  architecture:
    name: Architecture Guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          test -d drone_telemetry
          test -d ai_core
          test -d bridge
          test -d controller/android
          test -d drone
          test -d firmware
          test -d storage
          test -d website/astro

  summary:
    name: ARES CI summary
    if: always()
    needs: [telemetry, cpp, go, flutter, firmware, architecture]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test "${{ needs.telemetry.result }}" = success
          test "${{ needs.cpp.result }}" = success
          test "${{ needs.go.result }}" = success
          test "${{ needs.flutter.result }}" = success
          test "${{ needs.firmware.result }}" = success
          test "${{ needs.architecture.result }}" = success
